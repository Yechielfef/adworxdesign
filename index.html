*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow-x:hidden;color:#fff;padding:0 0 max(3vw,12px)}
.hero{flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:min(4vw,3rem);padding:4vh 5vw 2vh;direction:rtl}
h1{font-family:"FbElectron","Arial Hebrew",Arial,sans-serif;font-weight:400;font-size:clamp(2.6rem,min(11vw,13vh),9rem);line-height:1.05;text-align:right}
h1 span{display:block}
.hand{perspective:900px;flex:none;width:clamp(120px,min(26vw,34vh),340px)}
.hand img{display:block;width:100%;height:auto;transform-origin:50% 90%;animation:sway 6s ease-in-out infinite,glow 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-22deg) rotateZ(-3deg) translateY(0)}50%{transform:rotateY(22deg) rotateZ(3deg) translateY(-3%)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,255,255,.35)) drop-shadow(0 0 28px rgba(255,255,255,.2))}50%{filter:drop-shadow(0 0 18px rgba(255,255,255,.7)) drop-shadow(0 0 50px rgba(255,255,255,.4))}}
.logo{width:94vw;max-width:2200px;height:auto;display:block;padding:0}
@media (max-aspect-ratio:3/4){.hero{flex-direction:column;gap:5vh}h1{text-align:center;font-size:clamp(2.6rem,min(19vw,10vh),9rem)}.hand{width:clamp(120px,40vw,300px)}}
@media (prefers-reduced-motion:reduce){.hand img{animation:none}}
